<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fiha — the asthetic store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF8FB;--blush:#FFE8F3;--pink-lt:#FFC2DF;--pink:#F4679D;--pink-dk:#C94B7A;--maroon:#8B1A4A;--ink:#3D2035;--gray:#9A8494;--gold:#D4A847;--mint:#D4F0E4;--white:#fff;--sh:rgba(61,32,53,0.10);}
*{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:'Jost',sans-serif;font-size:15px;line-height:1.6;overflow-x:hidden;}
img{max-width:100%;display:block;}a{color:inherit;text-decoration:none;}button{cursor:pointer;font-family:inherit;}input,textarea,select{font-family:inherit;}
h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--maroon);line-height:1.2;}
/* announcement */
.ann{background:var(--maroon);color:#fff;text-align:center;padding:9px 16px;font-size:0.8rem;font-weight:500;letter-spacing:0.02em;}
/* nav */
header{position:sticky;top:0;z-index:100;background:rgba(255,248,251,0.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--blush);}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:16px;}
.nav-logo{display:flex;flex-direction:column;cursor:pointer;}
.logo-main{font-family:'Dancing Script',cursive;font-size:1.7rem;color:var(--maroon);line-height:1;}
.logo-sub{font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray);}
.nav-links{display:flex;gap:26px;font-size:0.87rem;font-weight:500;}
.nav-links a{position:relative;padding-bottom:3px;cursor:pointer;}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--pink);transition:width .25s;}
.nav-links a:hover::after{width:100%;}
.nav-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{background:none;border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;position:relative;transition:background .2s;}
.icon-btn:hover{background:var(--blush);}
.badge-dot{position:absolute;top:4px;right:4px;width:17px;height:17px;background:var(--pink);color:#fff;border-radius:50%;font-size:0.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.search-bar{display:flex;align-items:center;background:var(--blush);border-radius:20px;padding:7px 14px 7px 10px;gap:6px;width:190px;}
.search-bar input{background:none;border:none;font-size:0.85rem;width:100%;color:var(--ink);}
.search-bar input:focus{outline:none;}
/* pages */
.page{display:none;min-height:60vh;}
.page.active{display:block;}
/* hero */
.hero{min-height:460px;background:linear-gradient(135deg,#FFE0EF 0%,#FFC8DC 50%,#FFAFD0 100%);display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:60px 24px;}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.12) 0,rgba(255,255,255,0.12) 40px,transparent 40px,transparent 80px);}
.hero-content{position:relative;z-index:1;max-width:680px;}
.hero-tag{font-family:'Dancing Script',cursive;font-size:1.2rem;color:var(--pink-dk);display:block;margin-bottom:8px;}
.hero-content h1{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:14px;color:var(--maroon);}
.hero-content h1 em{font-style:italic;color:var(--pink-dk);}
.hero-content p{font-size:1rem;color:#5a3a4d;max-width:460px;margin:0 auto 24px;}
.hero-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
.pill{background:rgba(255,255,255,0.82);border:1px solid var(--pink-lt);border-radius:30px;padding:6px 14px;font-size:0.8rem;font-weight:500;color:var(--maroon);}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;border-radius:30px;font-size:0.9rem;font-weight:600;border:none;transition:transform .15s,box-shadow .15s;}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--maroon);color:#fff;box-shadow:0 4px 12px rgba(139,26,74,0.3);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(139,26,74,0.4);}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(244,103,157,0.35);}
.btn-outline{background:transparent;color:var(--maroon);border:2px solid var(--maroon);}
.btn-ghost{background:rgba(255,255,255,0.8);color:var(--maroon);border:1px solid var(--pink-lt);}
.btn-sm{padding:8px 16px;font-size:0.82rem;}
.btn-block{width:100%;justify-content:center;}
/* sections */
.sec{padding:52px 24px;}
.sec-inner{max-width:1200px;margin:0 auto;}
.sec-head{text-align:center;margin-bottom:32px;}
.sec-head .lbl{display:inline-block;background:var(--blush);color:var(--pink-dk);padding:4px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;}
.sec-head h2{font-size:clamp(1.5rem,3vw,2.1rem);}
.sec-head p{color:var(--gray);margin-top:8px;font-size:0.93rem;}
/* trust bar */
.trust-bar{background:var(--maroon);color:#fff;padding:12px 0;}
.trust-bar .wrap{max-width:1200px;margin:0 auto;display:flex;justify-content:center;gap:32px;flex-wrap:wrap;text-align:center;padding:0 24px;font-size:0.82rem;font-weight:500;}
/* cat strip */
.cat-strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;}
.cat-strip::-webkit-scrollbar{display:none;}
.cat-chip{flex-shrink:0;background:#fff;border:1.5px solid var(--pink-lt);border-radius:30px;padding:8px 18px;font-size:0.84rem;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;}
.cat-chip:hover,.cat-chip.active{background:var(--blush);border-color:var(--pink);color:var(--maroon);}
/* product grid */
.p-grid{columns:5 170px;column-gap:14px;}
.p-card{break-inside:avoid;margin-bottom:14px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px var(--sh);transition:transform .25s,box-shadow .25s;position:relative;cursor:pointer;}
.p-card:hover{transform:translateY(-5px);box-shadow:0 10px 28px var(--sh);}
.p-img-wrap{position:relative;overflow:hidden;}
.p-img{width:100%;object-fit:cover;display:block;}
.p-img-ph{width:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--blush);}
.p-badge{position:absolute;top:8px;left:8px;background:var(--maroon);color:#fff;font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:10px;text-transform:uppercase;}
.p-badge.sale{background:#C84B0A;}
.p-badge.new{background:var(--pink-dk);}
.p-badge.best{background:#9A6B00;}
.wl-btn{position:absolute;top:8px;right:8px;background:#fff;border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;box-shadow:0 2px 8px rgba(0,0,0,0.12);transition:transform .2s;z-index:2;}
.wl-btn:hover{transform:scale(1.2);}
.wl-btn.active{background:var(--blush);}
.p-info{padding:10px 12px 12px;}
.p-name{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.3;}
.p-price-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.p-price{font-weight:700;font-size:0.95rem;color:var(--maroon);}
.p-orig{font-size:0.8rem;color:var(--gray);text-decoration:line-through;}
.p-disc{font-size:0.75rem;color:#C84B0A;font-weight:600;}
.p-add-btn{width:100%;background:var(--blush);color:var(--maroon);border:none;padding:8px;font-size:0.8rem;font-weight:600;transition:background .2s;}
.p-add-btn:hover{background:var(--pink-lt);}
.oos-overlay{position:absolute;inset:0;background:rgba(255,255,255,0.7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;backdrop-filter:blur(2px);}
/* filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px;padding:14px 18px;background:#fff;border-radius:14px;box-shadow:0 2px 10px var(--sh);}
.f-select{background:var(--blush);border:none;border-radius:10px;padding:8px 12px;font-size:0.83rem;color:var(--ink);cursor:pointer;}
.f-select:focus{outline:none;}
/* product detail */
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:start;max-width:1100px;margin:0 auto;padding:36px 24px;}
.pd-imgs{position:sticky;top:90px;}
.pd-main-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;margin-bottom:10px;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden;}
.pd-thumbs{display:flex;gap:8px;overflow-x:auto;}
.pd-thumb{width:66px;height:66px;flex-shrink:0;border-radius:10px;object-fit:cover;cursor:pointer;opacity:0.6;border:2px solid transparent;transition:opacity .2s;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.pd-thumb.active{opacity:1;border-color:var(--pink);}
.pd-info .cat-tag{display:inline-block;background:var(--blush);color:var(--pink-dk);padding:3px 12px;border-radius:12px;font-size:0.75rem;font-weight:600;margin-bottom:10px;}
.pd-info h1{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:10px;}
.pd-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.pd-price{font-size:1.7rem;font-weight:700;color:var(--maroon);}
.var-lbl{font-weight:600;font-size:0.86rem;margin-bottom:7px;}
.var-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.var-opt{padding:7px 15px;border-radius:8px;border:1.5px solid var(--pink-lt);font-size:0.84rem;cursor:pointer;transition:all .2s;}
.var-opt.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
.qty-row{display:flex;align-items:center;gap:0;margin-bottom:18px;}
.qty-btn{width:34px;height:34px;background:var(--blush);border:none;border-radius:8px;font-size:1rem;font-weight:600;}
.qty-n{width:42px;text-align:center;font-weight:600;font-size:1rem;}
.pd-btns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.pd-btns .btn{flex:1;min-width:130px;justify-content:center;}
.pd-meta{border-top:1px solid var(--blush);padding-top:18px;margin-top:4px;}
.pd-meta-row{font-size:0.86rem;color:var(--gray);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
/* cart */
.cart-layout{max-width:980px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:1fr 340px;gap:28px;}
.cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--blush);align-items:flex-start;}
.cart-img{width:78px;height:78px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--blush);display:flex;align-items:center;justify-content:center;font-size:1.8rem;}
.cart-item-info{flex:1;}
.cart-item-name{font-weight:600;font-size:0.93rem;margin-bottom:3px;}
.cart-item-var{font-size:0.78rem;color:var(--gray);margin-bottom:8px;}
.cart-item-price{font-weight:700;color:var(--maroon);}
.cq-row{display:flex;align-items:center;gap:6px;margin-top:8px;}
.cq-btn{width:26px;height:26px;background:var(--blush);border:none;border-radius:6px;font-size:0.95rem;}
.cart-remove{background:none;border:none;color:var(--gray);font-size:0.8rem;text-decoration:underline;display:block;margin-top:6px;cursor:pointer;}
/* order summary */
.o-summary{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 16px var(--sh);position:sticky;top:90px;}
.o-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:0.88rem;}
.o-total{font-size:1.05rem;font-weight:700;border-top:1px solid var(--blush);padding-top:12px;margin-top:2px;}
.coupon-row{display:flex;gap:8px;margin-bottom:14px;}
.coupon-row input{flex:1;padding:9px 12px;border:1.5px solid var(--blush);border-radius:10px;font-size:0.84rem;}
.coupon-row input:focus{outline:none;border-color:var(--pink);}
/* checkout */
.ck-layout{max-width:860px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:1fr 320px;gap:28px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:5px;}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 13px;border:1.5px solid var(--blush);border-radius:11px;font-size:0.88rem;background:#fff;transition:border-color .2s;}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--pink);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pay-opt{border:2px solid var(--blush);border-radius:13px;padding:14px 16px;cursor:pointer;transition:all .2s;margin-bottom:10px;}
.pay-opt.sel{border-color:var(--pink);background:var(--blush);}
.pay-opt-hd{display:flex;align-items:center;gap:10px;font-weight:600;}
.pay-opt-note{font-size:0.8rem;color:var(--gray);margin-top:5px;}
.upi-box{background:var(--blush);border-radius:12px;padding:14px;text-align:center;margin-top:10px;}
.qr-area{width:150px;height:150px;margin:0 auto 10px;background:#fff;border-radius:10px;border:2px dashed var(--pink-lt);display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--gray);text-align:center;padding:8px;overflow:hidden;}
.qr-area img{width:100%;height:100%;object-fit:contain;}
.upi-id-show{background:#fff;border-radius:8px;padding:9px 13px;font-weight:700;color:var(--maroon);font-size:0.93rem;margin-bottom:8px;}
.upload-zone{border:2px dashed var(--pink-lt);border-radius:11px;padding:18px;text-align:center;cursor:pointer;margin-top:10px;transition:background .2s;}
.upload-zone:hover{background:var(--blush);}
.upload-zone input{display:none;}
/* confirmation */
.confirm-pg{max-width:580px;margin:60px auto;text-align:center;padding:0 24px;}
.confirm-icon{font-size:3.8rem;margin-bottom:14px;}
.order-id-box{background:var(--blush);border-radius:14px;padding:16px 24px;margin:18px 0;display:inline-block;}
.order-id-box .oid{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--maroon);}
.steps-box{text-align:left;background:#fff;border-radius:16px;padding:18px 20px;margin:22px 0;box-shadow:0 4px 14px var(--sh);}
.step-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--blush);}
.step-row:last-child{border-bottom:none;}
.step-num{width:26px;height:26px;background:var(--pink);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;margin-top:2px;}
/* tracking */
.track-bar{display:flex;align-items:flex-start;justify-content:center;gap:0;margin:28px 0;flex-wrap:nowrap;overflow-x:auto;}
.track-step{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:80px;position:relative;}
.track-step::after{content:'';position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--blush);}
.track-step:last-child::after{display:none;}
.track-dot{width:26px;height:26px;border-radius:50%;background:var(--blush);border:2px solid var(--pink-lt);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;font-size:0.78rem;}
.track-dot.done{background:var(--pink);border-color:var(--pink);color:#fff;}
.track-dot.curr{background:var(--maroon);border-color:var(--maroon);color:#fff;}
.track-lbl{font-size:0.7rem;text-align:center;color:var(--gray);line-height:1.3;}
.track-lbl.curr{color:var(--maroon);font-weight:600;}
/* admin login */
.admin-login-pg{max-width:400px;margin:70px auto;padding:36px 30px;background:#fff;border-radius:22px;box-shadow:0 8px 32px var(--sh);}
.admin-login-pg h2{text-align:center;margin-bottom:6px;}
.admin-login-pg .sub{text-align:center;color:var(--gray);font-size:0.86rem;margin-bottom:24px;}
/* admin panel */
.admin-wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 58px);}
.admin-side{background:var(--maroon);color:#fff;padding:20px 0;}
.admin-side .side-logo{padding:0 18px 18px;border-bottom:1px solid rgba(255,255,255,0.15);font-family:'Dancing Script',cursive;font-size:1.3rem;}
.admin-nav-item{padding:11px 18px;display:flex;align-items:center;gap:10px;font-size:0.86rem;cursor:pointer;transition:background .2s;}
.admin-nav-item:hover,.admin-nav-item.active{background:rgba(255,255,255,0.14);}
.admin-main{padding:24px 28px;background:var(--cream);overflow-y:auto;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat-box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px var(--sh);text-align:center;}
.stat-box .sn{font-size:1.8rem;font-weight:700;color:var(--maroon);font-family:'Cormorant Garamond',serif;}
.stat-box .sl{font-size:0.75rem;color:var(--gray);margin-top:3px;}
.a-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px var(--sh);}
.a-card h3{font-size:1rem;margin-bottom:14px;color:var(--maroon);}
.a-table{width:100%;border-collapse:collapse;font-size:0.84rem;}
.a-table th{background:var(--blush);color:var(--maroon);padding:9px 12px;text-align:left;font-weight:600;}
.a-table td{padding:9px 12px;border-bottom:1px solid var(--blush);}
.a-table tr:last-child td{border-bottom:none;}
.s-pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:0.72rem;font-weight:600;}
.s-pill.pending{background:#FFF3CD;color:#856404;}
.s-pill.verified{background:#D1FAE5;color:#065F46;}
.s-pill.confirmed,.s-pill.packed{background:var(--blush);color:var(--pink-dk);}
.s-pill.shipped,.s-pill.out{background:#DBEAFE;color:#1E40AF;}
.s-pill.delivered{background:#D1FAE5;color:#065F46;}
.s-pill.cancelled{background:#FEE2E2;color:#991B1B;}
/* product form */
.img-preview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px;}
.img-preview{aspect-ratio:1;border-radius:8px;background:var(--blush);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.img-preview img{width:100%;height:100%;object-fit:cover;}
.img-remove{position:absolute;top:3px;right:3px;width:18px;height:18px;background:rgba(0,0,0,0.55);color:#fff;border-radius:50%;border:none;font-size:0.7rem;display:flex;align-items:center;justify-content:center;}
/* modals */
.modal-ov{position:fixed;inset:0;background:rgba(61,32,53,0.6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-ov.open{display:flex;}
.modal-box{background:#fff;border-radius:22px;padding:30px;max-width:400px;width:100%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:90vh;overflow-y:auto;}
.modal-close{position:absolute;top:13px;right:14px;background:var(--blush);border:none;width:30px;height:30px;border-radius:50%;font-size:1rem;color:var(--maroon);}
/* faq */
.faq-item{border-bottom:1px solid var(--blush);}
.faq-q{padding:16px 0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:0.95rem;}
.faq-a{padding-bottom:14px;color:#5a4a54;font-size:0.9rem;line-height:1.7;display:none;}
.faq-a.open{display:block;}
/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;}
.toast{background:var(--maroon);color:#fff;padding:11px 22px;border-radius:30px;font-size:0.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:tIn .3s ease,tOut .3s ease 2.4s forwards;}
@keyframes tIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes tOut{to{opacity:0;transform:translateY(8px);}}
/* wishlist */
.wl-empty{text-align:center;padding:70px 24px;color:var(--gray);}
/* policies */
.policy-content{max-width:800px;margin:0 auto;padding:48px 24px;}
.policy-content h1{margin-bottom:24px;}
.policy-content h3{color:var(--maroon);margin:24px 0 10px;font-size:1.1rem;}
.policy-content p{color:#5a4a54;margin-bottom:12px;font-size:0.93rem;line-h
